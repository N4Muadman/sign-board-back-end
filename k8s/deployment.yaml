apiVersion: apps/v1
kind: Deployment
metadata:
  name: signboard-deployment
  namespace: default
  labels:
    app: signboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signboard
  template:
    metadata:
      labels:
        app: signboard
    spec:
      containers:
      - name: signboard
        image: ai2-be
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_MAIL_USERNAME
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_MAIL_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: JWT_SECRET
        - name: CANVA_API_KEY
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: CANVA_API_KEY
        - name: CANVA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: CANVA_API_SECRET
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CANVA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CANVA_CLIENT_ID
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CANVA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CANVA_CLIENT_SECRET
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: signboard-secret
              key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        envFrom:
        - configMapRef:
            name: signboard-config
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5